<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Exercise 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .header-div {
            background-color: #2c5282;
            color: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .form-div {
            background-color: white;
            border: 2px solid #bee3f8;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .calculator-div {
            background-color: white;
            border: 2px solid #9ae6b4;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }
        .footer-div {
            background-color: #319795;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .slogan {
            font-style: italic;
            color: #e2e8f0;
        }
        div div {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. Header div: Site title in <h1> (block) with a slogan in <span> (inline) -->
    <div class="header-div">
        <h1>Wonderbuuk <span class="slogan">Your Ultimate Web Guide</span></h1>
    </div>

    <!-- 2. Contact form div: Email input, preferred contact date, satisfaction range slider, and submit button -->
    <div class="form-div">
        <h2>Contact Us</h2>
        <form action="#" method="POST">
            <div>
                <label for="email">Email address:</label><br>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div>
                <label for="contact-date">Preferred contact date:</label><br>
                <input type="date" id="contact-date" name="contactDate" required>
            </div>
            <div>
                <label for="satisfaction">Satisfaction Level (0 to 10):</label><br>
                <input type="range" id="satisfaction" name="satisfaction" min="0" max="10" value="5">
            </div>
            <div>
                <button type="submit">Submit Form</button>
            </div>
        </form>
    </div>

    <!-- 3. Calculator div: Two number inputs and an <output> that shows their sum live -->
    <div class="calculator-div">
        <h2>Live Inline Calculator</h2>
        <form oninput="sumResult.value = parseInt(num1.value || 0) + parseInt(num2.value || 0)">
            <input type="number" id="num1" name="num1" value="5"> +
            <input type="number" id="num2" name="num2" value="5"> =
            <output name="sumResult" for="num1 num2">10</output>
        </form>
    </div>

    <!-- 4. Footer div: Contact info and copyright entity -->
    <div class="footer-div">
        <p>Contact Support: support@wonderbuuk.com</p>
        <p>All rights reserved &copy; 2026 Wonderbuuk.</p>
    </div>

</body>
</html>
