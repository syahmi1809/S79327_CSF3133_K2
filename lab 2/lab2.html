<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>
</head>
<body>

    <header>
        <h1>Personal Profile</h1>
    </header>

    <nav>
        <a href="#profile">Profile</a> | <a href="#form">Form</a>
    </nav>

    <section id="profile">
        <article>
            <table border="1">
                <tr>
                    <th>Information Type</th>
                    <th>Details</th>
                    <th>Additional Notes</th>
                </tr>
                <tr>
                    <td>Name</td>
                    <td>Nik Muhammad Syahmi Bin Zakaria</td>
                    <td>Taken</td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td>20</td>
                    <td>Born in 2006</td>
                </tr>
                <tr>

                    <td>Year 2 Mobile Computing Student</td>

            </table>

    <section id="form">
        <form action="#" method="post">
            <p>
                <label for="userName">Name:</label>
                <input type="text" id="userName" name="userName">
            </p>
            <p>
                <label for="userEmail">Email:</label>
                <input type="text" id="userEmail" name="userEmail">
            </p>

            <p>Gender:</p>
            <input type="radio" id="genderMale" name="gender" value="male">
            <label for="genderMale">Male</label>
            <input type="radio" id="genderFemale" name="gender" value="female">
            <label for="genderFemale">Female</label>

            <p>Favorite Hobbies:</p>
            <input type="checkbox" id="hobbyFootball" name="hobbies" value="football">
            <label for="hobbyFootball">Football</label>
            
            <input type="checkbox" id="hobbyGaming" name="hobbies" value="gaming">
            <label for="hobbyGaming">Futsal/label>
            
            <input type="checkbox" id="hobbyDesign" name="hobbies" value="design">
            <label for="hobbyDesign">Digital Illustration</label>

            <p>
                <input type="submit" value="Submit">
            </p>
        </form>
    </section>
